app:
  name: semantic-opinion-monitor
  display_name: "五华区民意诉求语义分析系统"
  demo_mode: true
  version: "0.7.0"
  host: "0.0.0.0"
  port: 8000

embedding:
  provider: "local"
  model_name: "Qwen/Qwen3-Embedding-4B"
  model_revision: "main"
  vector_dimension: 2560
  normalize: true
  batch_size: 32
  preprocess_version: "v1"
  cache_enabled: true

routing:
  top_k_anchors: 5
  candidate_topics: 3
  known_topic_threshold: 0.65
  unknown_threshold: 0.55

discovery:
  min_cluster_size: 5
  method: "hdbscan"
  min_samples: 3
  cluster_selection_method: "eom"
  max_representative_samples: 5
  anchor_proposal_count: 4
  min_unknown_for_clustering: 5

llm:
  provider: "mock"
  model: "mock-v1"
  temperature: 0.2
  max_retries: 2
  api_base: ""
  api_key_env: "LLM_API_KEY"

database:
  path: "data/app.db"

vector_store:
  provider: "chroma"
  persist_directory: "data/chroma_db"

server:
  workers: 1
  reload: false

crawler:
  enabled: true
  default_delay: 2.0
  request_timeout: 30
  max_retries: 3
  retry_backoff: 5.0
  user_agent: "WuhuaOpinionMonitor/0.7"
  respect_robots_txt: true
  max_pages_per_crawl: 200
  default_headers:
    Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
    Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
    Accept-Encoding: "gzip, deflate"
  sites:
    gov_portal:
      enabled: true
      urls:
        - "http://www.kmwh.gov.cn"
      category: government
      delay: 3.0
      max_pages: 50
    gov_hotline:
      enabled: true
      urls:
        - "http://ldkm.km.gov.cn"
      category: government
      delay: 5.0
      max_pages: 30
    news_forum:
      enabled: true
      urls:
        - "https://tieba.baidu.com/f?kw=昆明"
      category: forum
      delay: 2.0
      max_pages: 100
    social_weibo:
      enabled: false
      urls:
        - "https://s.weibo.com/weibo?q=五华区"
      category: social
      delay: 5.0
      max_pages: 20
    social_zhihu:
      enabled: false
      urls:
        - "https://www.zhihu.com/search?q=五华区&type=content"
      category: social
      delay: 5.0
      max_pages: 20
