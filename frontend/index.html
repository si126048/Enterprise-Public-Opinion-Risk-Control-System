<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五华民意·态势感知</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/maps.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-brand">
            <span class="brand-icon">◆</span>
            <span class="brand-text">五华民意·态势感知</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">总览</a></li>
            <li><a href="pages/content.html">诉求列表</a></li>
            <li><a href="pages/search.html">语义搜索</a></li>
            <li><a href="pages/topics.html">主题库</a></li>
            <li><a href="pages/review.html" class="nav-highlight">审核</a></li>
            <li><a href="pages/sources.html">来源</a></li>
            <li><a href="pages/validation.html">验证</a></li>
        </ul>
        <div class="nav-actions">
            <span class="data-badge">数据更新: 今日</span>
            <button class="nav-toggle" aria-label="菜单">≡</button>
        </div>
    </nav>

    <!-- Dashboard Layout: Map + Panel -->
    <div class="main-content">
        <div class="dashboard-layout">
            <!-- Left: Map -->
            <div class="dashboard-map">
                <div id="map-container"></div>
                <button class="map-reset-btn">↩ 重置视图</button>
                <div class="map-legend">
                    <h4>诉求密度</h4>
                    <div class="map-legend-item"><span class="map-legend-color" style="background:#EDE8DF"></span> &lt;50</div>
                    <div class="map-legend-item"><span class="map-legend-color" style="background:#F5E6A3"></span> 50-150</div>
                    <div class="map-legend-item"><span class="map-legend-color" style="background:#FFD700"></span> 150-300</div>
                    <div class="map-legend-item"><span class="map-legend-color" style="background:#F6A83D"></span> 300-500</div>
                    <div class="map-legend-item"><span class="map-legend-color" style="background:#F65413"></span> &gt;500</div>
                </div>
            </div>

            <!-- Right: Panel -->
            <div class="dashboard-panel">
                <!-- Stat Cards -->
                <div class="section">
                    <div class="section-title">核心指标</div>
                    <div id="stats-cards" class="grid grid-3"></div>
                </div>

                <!-- Topic Rank -->
                <div class="section">
                    <div class="section-title">主题排行</div>
                    <div id="topic-rank"></div>
                </div>

                <!-- Trend Chart -->
                <div class="section">
                    <div class="section-title">近7天趋势</div>
                    <div id="chart-trend" style="height: 180px;"></div>
                </div>

                <!-- Sentiment + Topic Charts -->
                <div class="section">
                    <div class="grid grid-2">
                        <div>
                            <div class="section-title">情感分布</div>
                            <div id="chart-sentiment-dist" style="height: 180px;"></div>
                        </div>
                        <div>
                            <div class="section-title">主题分布</div>
                            <div id="chart-topic-dist" style="height: 180px;"></div>
                        </div>
                    </div>
                </div>

                <!-- High Risk -->
                <div class="section">
                    <div class="section-title">高风险样本</div>
                    <div id="high-risk-table"></div>
                </div>

                <!-- Content List (for drill-down) -->
                <div class="section" id="dashboard-content-section" style="display:none">
                    <div class="section-title">区域诉求</div>
                    <div id="dashboard-content-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detail-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3>诉求详情</h3>
                <button class="modal-close">×</button>
            </div>
            <div id="detail-modal-body"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <span>昆明市五华区 | 课程演示项目</span>
        <span class="demo-tag">Demo Mode</span>
    </footer>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="data/mock/mock_data.js"></script>
    <script src="data/mock/mock_stats.js"></script>
    <script src="data/mock/mock_topics.js"></script>
    <script src="js/api.js"></script>
    <script src="js/store.js"></script>
    <script src="js/components.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/map.js"></script>
    <script src="js/interactions.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            Interactions.init();
            Interactions.initDashboard();
        });
    </script>
</body>
</html>
