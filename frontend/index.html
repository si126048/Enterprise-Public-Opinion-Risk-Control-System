<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业舆情风控·态势感知</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-brand">
            <span class="brand-icon">◆</span>
            <span class="brand-text">企业舆情风控</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">总览</a></li>
            <li><a href="pages/content.html">舆情列表</a></li>
            <li><a href="pages/search.html">语义搜索</a></li>
            <li><a href="pages/topics.html">风险主题</a></li>
            <li><a href="pages/risk_events.html">风控事件</a></li>
        </ul>
        <div class="nav-actions">
            <select id="company-selector" class="company-selector" title="选择公司"></select>
            <span class="data-badge">数据更新: 今日</span>
            <button class="theme-toggle" title="切换到夜间模式">☾</button>
            <button class="nav-toggle" aria-label="菜单">≡</button>
        </div>
    </nav>

    <!-- Dashboard Layout -->
    <div class="main-content">
        <div class="dashboard-layout">
            <!-- Left: Distribution Charts -->
            <div class="dashboard-map">
                <div class="section">
                    <div class="section-title">平台分布</div>
                    <div id="chart-platform-dist" style="height: 280px;"></div>
                </div>
                <div class="section">
                    <div class="section-title">产品分布</div>
                    <div id="chart-product-dist" style="height: 280px;"></div>
                </div>
                <div id="timeline-container"></div>
            </div>

            <!-- Right: Panel -->
            <div class="dashboard-panel">
                <!-- Stat Cards -->
                <div class="section">
                    <div class="section-title">核心指标</div>
                    <div id="stats-cards" class="grid grid-3"></div>
                </div>

                <!-- Topic Rank -->
                <div class="section">
                    <div class="section-title">风险主题排行</div>
                    <div id="topic-rank"></div>
                </div>

                <!-- Trend Chart -->
                <div class="section">
                    <div class="section-title">近期趋势</div>
                    <div id="chart-trend" style="height: 200px;"></div>
                </div>

                <!-- Topic Distribution -->
                <div class="section">
                    <div class="section-title">主题分布</div>
                    <div id="chart-topic-dist" style="height: 180px;"></div>
                </div>

                <!-- Content List (for drill-down) -->
                <div class="section" id="dashboard-content-section" style="display:none">
                    <div class="section-title">产品舆情</div>
                    <div id="dashboard-content-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detail-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3>舆情详情</h3>
                <button class="modal-close">×</button>
            </div>
            <div id="detail-modal-body"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <span>企业舆情风控管理系统 v1.0.0</span>
        <span class="demo-tag">演示数据</span>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="data/mock/mock_data.js"></script>
    <script src="data/mock/mock_stats.js"></script>
    <script src="data/mock/mock_topics.js"></script>
    <script src="js/api.js"></script>
    <script src="js/store.js"></script>
    <script src="js/components.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/map.js"></script>
    <script src="js/interactions.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/evidence_panel.js"></script>
    <script src="js/company_selector.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            CompanySelector.init();
            Interactions.init();
            Interactions.initDashboard();

            if (typeof TimelinePlayer !== 'undefined') {
                TimelinePlayer.init('timeline-container');
            }
        });
    </script>
</body>
</html>
