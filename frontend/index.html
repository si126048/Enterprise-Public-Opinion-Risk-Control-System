<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>企业舆情风控管理系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css?v=8" />
  <link rel="stylesheet" href="css/layout.css?v=8" />
  <link rel="stylesheet" href="css/components.css?v=8" />
  <link rel="stylesheet" href="css/animations.css?v=8" />
  <link rel="stylesheet" href="css/responsive.css?v=8" />
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo-icon">◆</div>
        <span class="sidebar-logo-text">舆情风控</span>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">主导航</div>
        <div class="nav-item active" data-page="dashboard">
          <span class="nav-item-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><rect x="2" y="2" width="5.5" height="5.5"/><rect x="10.5" y="2" width="5.5" height="5.5"/><rect x="2" y="10.5" width="5.5" height="5.5"/><rect x="10.5" y="10.5" width="5.5" height="5.5"/></svg></span>
          <span class="nav-item-text">舆情总览</span>
        </div>
        <div class="nav-item" data-page="content">
          <span class="nav-item-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><rect x="3" y="1.5" width="12" height="15"/><line x1="6" y1="5.5" x2="12" y2="5.5"/><line x1="6" y1="9" x2="12" y2="9"/><line x1="6" y1="12.5" x2="10" y2="12.5"/></svg></span>
          <span class="nav-item-text">舆情列表</span>
        </div>
        <div class="nav-item" data-page="search">
          <span class="nav-item-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><circle cx="9" cy="9" r="6.5"/><line x1="9" y1="2.5" x2="9" y2="15.5"/><line x1="2.5" y1="9" x2="15.5" y2="9"/><line x1="4" y1="4" x2="14" y2="14"/></svg></span>
          <span class="nav-item-text">语义搜索</span>
        </div>
        <div class="nav-item" data-page="topics">
          <span class="nav-item-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M9 2 L16 9 L9 16 L2 9 Z"/><path d="M9 5.5 L13 9 L9 12.5 L5 9 Z"/><path d="M9 8 L10.5 9 L9 10 L7.5 9 Z"/></svg></span>
          <span class="nav-item-text">风险主题</span>
        </div>
        <div class="nav-item" data-page="risk-events">
          <span class="nav-item-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M9 1.5 L15.5 5 L15.5 11 L9 16.5 L2.5 11 L2.5 5 Z"/><line x1="9" y1="6" x2="9" y2="11"/><rect x="8" y="12" width="2" height="1.5"/></svg></span>
          <span class="nav-item-text">风控事件</span>
        </div>
        <div class="nav-item" data-page="review">
          <span class="nav-item-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M9 2 L16 9 L9 16 L2 9 Z"/><circle cx="9" cy="9" r="3"/></svg></span>
          <span class="nav-item-text">新风险审核</span>
        </div>
        <div class="nav-item" data-page="credibility">
          <span class="nav-item-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><line x1="9" y1="2" x2="9" y2="16"/><line x1="3" y1="5" x2="9" y2="2"/><line x1="15" y1="5" x2="9" y2="2"/><line x1="3" y1="5" x2="3" y2="8"/><line x1="15" y1="5" x2="15" y2="8"/><line x1="5" y1="16" x2="13" y2="16"/></svg></span>
          <span class="nav-item-text">信度分析</span>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="nav-item" data-page="source-ledger">
          <span class="nav-item-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><rect x="2.5" y="2" width="13" height="4"/><rect x="2.5" y="7" width="13" height="4"/><rect x="2.5" y="12" width="13" height="4"/></svg></span>
          <span class="nav-item-text">来源台账</span>
        </div>
      </div>
    </aside>

    <!-- Sidebar overlay for mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Main content area -->
    <div class="main-area">
      <!-- Topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-hamburger" id="hamburger">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </div>
          <div class="company-selector" id="company-selector">
            <span>米哈游</span>
            <span class="arrow">▼</span>
            <div class="company-dropdown" id="company-dropdown">
              <div class="company-dropdown-item active">米哈游</div>
            </div>
          </div>
        </div>

        <div class="topbar-center">
          <div class="global-search">
            <span class="global-search-icon"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" style="width:14px;height:14px"><circle cx="7.5" cy="7.5" r="5"/><path d="M11 11l5 5"/></svg></span>
            <input type="text" class="global-search-input" id="global-search" placeholder="搜索舆情、主题、事件..." />
            <span class="global-search-shortcut">⌘K</span>
          </div>
        </div>

        <div class="topbar-right">
          <div class="topbar-action" id="notification-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="notification-badge" id="notification-badge"></span>
          </div>
          <div class="user-avatar" id="user-avatar">A</div>
        </div>
      </header>

      <!-- Content area -->
      <main class="content-area" id="content-area">
        <!-- Dynamic page content loads here -->
      </main>
    </div>
  </div>

  <!-- Drawer for detail panels -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <h3 class="drawer-title" id="drawer-title">详情</h3>
      <div class="drawer-close" id="drawer-close">✕</div>
    </div>
    <div class="drawer-body" id="drawer-body">
      <!-- Dynamic content -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="js/lieflat-charts.js?v=8"></script>
  <script src="js/app.js?v=8"></script>
</body>
</html>
