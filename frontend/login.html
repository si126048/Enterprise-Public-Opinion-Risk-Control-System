<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 企业舆情风控</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <div class="login-page">
    <!-- Background glows -->
    <div class="bg-glow bg-glow--blue"></div>
    <div class="bg-glow bg-glow--purple"></div>

    <!-- Particle grid background -->
    <div class="login-particles" id="particles"></div>

    <!-- Login card -->
    <div class="login-card">
      <div class="login-header">
        <span class="logo-icon">◆</span>
        <span class="logo-text">企业舆情风控</span>
        <span class="logo-sub">Enterprise Risk Monitor</span>
      </div>

      <form class="login-form" id="login-form">
        <div class="form-group">
          <label>账号</label>
          <input type="email" class="form-input" id="email" placeholder="admin@example.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" class="form-input" id="password" placeholder="················" autocomplete="current-password" />
        </div>
        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" checked /> 记住我
          </label>
          <a href="#" class="forgot-link">忘记密码？</a>
        </div>
        <button type="submit" class="btn-login" id="btn-login">
          <span class="btn-text">登 录</span>
          <span class="spinner"></span>
          <span class="check-icon">✓</span>
        </button>
        <div class="login-error" id="login-error">账号或密码错误</div>
      </form>

      <div class="login-footer">
        v1.0.0 · 米哈游舆情监测
      </div>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
