<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 舆情风控系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="login-page">
    <!-- Left panel: immersive dark -->
    <div class="login-left">
      <div class="left-decor">
        <div class="decor-grid"></div>
        <div class="decor-lines">
          <div class="decor-line"></div>
          <div class="decor-line"></div>
          <div class="decor-line"></div>
        </div>
        <div class="decor-diamond"></div>
        <div class="decor-diamond decor-diamond--sm"></div>
        <div class="decor-dots">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="left-content">
        <div class="brand-block">
          <div class="brand-icon">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
              <rect x="4" y="4" width="40" height="40" stroke="#F5D000" stroke-width="2" transform="rotate(45 24 24)" fill="none"/>
              <rect x="14" y="14" width="20" height="20" stroke="#F5D000" stroke-width="1.5" transform="rotate(45 24 24)" fill="none"/>
              <circle cx="24" cy="24" r="4" fill="#F5D000"/>
            </svg>
          </div>
          <h1 class="brand-title">[ 舆情风控系统 ]</h1>
          <p class="brand-sub">ENDFIELD MONITOR</p>
          <div class="brand-line"></div>
          <p class="brand-desc">Enterprise Opinion Risk Control System</p>
        </div>

        <div class="left-footer">
          <span>v1.0.0</span>
          <span class="footer-sep">|</span>
          <span>舆情监测与分析平台</span>
        </div>
      </div>
    </div>

    <!-- Right panel: login form -->
    <div class="login-right">
      <div class="login-form-wrapper">
        <div class="form-header">
          <div class="form-logo">
            <svg width="32" height="32" viewBox="0 0 48 48" fill="none">
              <rect x="4" y="4" width="40" height="40" stroke="#1A1A1A" stroke-width="2.5" transform="rotate(45 24 24)" fill="none"/>
              <circle cx="24" cy="24" r="4" fill="#1A1A1A"/>
            </svg>
          </div>
          <h2 class="form-title">账号登录</h2>
        </div>

        <!-- Tab switch -->
        <div class="login-tabs">
          <button class="login-tab active" data-tab="account">账号密码登录</button>
          <button class="login-tab" data-tab="code">验证码登录</button>
        </div>

        <!-- Account form -->
        <form class="login-form" id="login-form-account">
          <div class="form-group">
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </span>
              <input type="text" class="form-input" id="email" placeholder="请输入账号" autocomplete="username" />
            </div>
          </div>
          <div class="form-group">
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input type="password" class="form-input" id="password" placeholder="请输入密码" autocomplete="current-password" />
            </div>
          </div>
          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" checked /> 记住我
            </label>
            <a href="#" class="forgot-link">忘记密码？</a>
          </div>
          <button type="submit" class="btn-submit" id="btn-login">
            <span class="btn-text">登 录</span>
            <span class="btn-spinner"></span>
            <span class="btn-check">&#10003;</span>
          </button>
          <div class="login-error" id="login-error">账号或密码错误</div>
        </form>

        <!-- Code form (hidden by default) -->
        <form class="login-form" id="login-form-code" style="display:none;">
          <div class="form-group">
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72"/>
                </svg>
              </span>
              <input type="tel" class="form-input" id="phone" placeholder="请输入手机号" />
            </div>
          </div>
          <div class="form-group">
            <div class="input-wrapper code-input-wrapper">
              <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="2" y="4" width="20" height="16" rx="2"/>
                  <path d="M2 8h20"/>
                </svg>
              </span>
              <input type="text" class="form-input" id="verify-code" placeholder="请输入验证码" maxlength="6" />
              <button type="button" class="btn-send-code" id="btn-send-code">获取验证码</button>
            </div>
          </div>
          <button type="submit" class="btn-submit">
            <span class="btn-text">登 录</span>
          </button>
        </form>

        <div class="form-footer">
          <span class="footer-text">登录即表示同意</span>
          <a href="#">用户协议</a>
          <span class="footer-text">和</span>
          <a href="#">隐私政策</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
