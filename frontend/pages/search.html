<!-- Search page -->
<div class="page-header">
  <div>
    <h1 class="page-title">语义搜索</h1>
    <div class="page-subtitle">AI 驱动的智能搜索</div>
  </div>
</div>

<!-- Search box -->
<div style="max-width: 600px; margin: 0 auto 32px;">
  <div style="position: relative;">
    <input type="text" id="search-input" class="input" style="width: 100%; height: 48px; font-size: 15px; padding: 0 20px 0 44px; border-radius: 24px;" placeholder="输入关键词或自然语言查询..." />
    <span style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted);"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" style="width:16px;height:16px"><circle cx="7.5" cy="7.5" r="5"/><path d="M11 11l5 5"/></svg></span>
  </div>
  <div style="margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap;">
    <span style="font-size: 12px; color: var(--color-text-muted);">热门搜索：</span>
    <span class="badge badge-outline" style="cursor: pointer;">抽卡机制</span>
    <span class="badge badge-outline" style="cursor: pointer;">版本更新</span>
    <span class="badge badge-outline" style="cursor: pointer;">角色平衡</span>
    <span class="badge badge-outline" style="cursor: pointer;">社区运营</span>
  </div>
</div>

<!-- Results info -->
<div id="results-info" style="font-size: 13px; color: var(--color-text-muted); margin-bottom: 12px;"></div>

<!-- Search results -->
<div id="search-results">
  <div class="empty-state">
    <div class="empty-state-icon"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" style="width:48px;height:48px;color:var(--color-text-muted)"><circle cx="20" cy="20" r="14"/><path d="M30 30l12 12"/></svg></div>
    <div class="empty-state-text">输入关键词开始搜索</div>
  </div>
</div>
