<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语义搜索 - 五华民意·态势感知</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/mobile.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-brand">
            <span class="brand-icon">◆</span>
            <span class="brand-text">五华民意·态势感知</span>
        </div>
        <ul class="nav-links">
            <li><a href="../index.html">总览</a></li>
            <li><a href="content.html">诉求列表</a></li>
            <li><a href="search.html" class="active">语义搜索</a></li>
            <li><a href="topics.html">主题库</a></li>
            <li><a href="review.html" class="nav-highlight">审核</a></li>
            <li><a href="sources.html">来源</a></li>
            <li><a href="validation.html">验证</a></li>
        </ul>
        <div class="nav-actions">
            <span class="data-badge">数据更新: 今日</span>
            <button class="nav-toggle" aria-label="菜单">≡</button>
        </div>
    </nav>

    <div class="main-content">
        <div class="page-body">
            <!-- Search Bar -->
            <div class="section">
                <div class="section-title">语义搜索</div>
                <div class="search-bar">
                    <input type="text" id="search-query" class="input" placeholder="输入自然语言查询，如：物业管理问题、噪音投诉...">
                    <button id="btn-search" class="btn btn-primary">搜索</button>
                </div>
                <div class="filter-bar">
                    <select id="filter-topic" class="select" style="min-width:140px">
                        <option value="">全部主题</option>
                        <option value="topic_001">物业管理</option>
                        <option value="topic_002">市容环境</option>
                        <option value="topic_003">交通出行</option>
                        <option value="topic_004">教育入学</option>
                        <option value="topic_005">医疗卫生</option>
                        <option value="topic_006">社会保障</option>
                        <option value="topic_007">公共安全</option>
                        <option value="topic_008">文化服务</option>
                    </select>
                    <select id="filter-sentiment" class="select" style="min-width:120px">
                        <option value="">全部情感</option>
                        <option value="positive">正面</option>
                        <option value="neutral">中性</option>
                        <option value="negative">负面</option>
                    </select>
                    <select id="filter-risk" class="select" style="min-width:120px">
                        <option value="">全部风险</option>
                        <option value="high">高风险</option>
                        <option value="medium">中风险</option>
                        <option value="low">低风险</option>
                    </select>
                </div>
            </div>

            <!-- AI Summary -->
            <div id="ai-summary" class="section" style="display:none">
                <div class="card" style="border-left:3px solid var(--color-accent-cyan)">
                    <div style="font-size:0.8rem;color:var(--color-accent-cyan);font-weight:700;margin-bottom:0.5rem">AI 总结</div>
                    <div id="ai-summary-text" style="font-size:0.9rem;line-height:1.7"></div>
                </div>
            </div>

            <!-- Results Info -->
            <div id="results-info" class="text-muted mb-1" style="font-size:0.85rem"></div>

            <!-- Results List -->
            <div id="search-results"></div>

            <!-- Pagination -->
            <div id="search-pagination"></div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detail-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3>诉求详情</h3>
                <button class="modal-close">×</button>
            </div>
            <div id="detail-modal-body"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <span>昆明市五华区 | 课程演示项目</span>
        <span class="demo-tag">Demo Mode</span>
    </footer>

    <script src="../data/mock/mock_data.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/interactions.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            Interactions.init();
            SearchPage.init();
        });

        var SearchPage = {
            currentPage: 1,
            pageSize: 20,

            init: function() {
                var self = this;

                document.getElementById('btn-search').addEventListener('click', function() { self.doSearch(); });
                document.getElementById('search-query').addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') self.doSearch();
                });

                ['filter-topic', 'filter-sentiment', 'filter-risk'].forEach(function(id) {
                    document.getElementById(id).addEventListener('change', function() {
                        if (document.getElementById('search-query').value.trim()) {
                            self.currentPage = 1;
                            self.doSearch();
                        }
                    });
                });
            },

            doSearch: function() {
                var self = this;
                var query = document.getElementById('search-query').value.trim();
                if (!query) return;

                var filters = {
                    topic_id: document.getElementById('filter-topic').value || undefined,
                    sentiment: document.getElementById('filter-sentiment').value || undefined,
                    risk_level: document.getElementById('filter-risk').value || undefined,
                    page: this.currentPage,
                    page_size: this.pageSize
                };

                document.getElementById('search-results').innerHTML = '<div class="loading-state"><div class="loading-spinner"></div>搜索中...</div>';

                var startTime = Date.now();

                ApiService.semanticSearch(query, filters).then(function(data) {
                    var elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                    var items = data.items || [];
                    var total = data.total || items.length;

                    document.getElementById('results-info').textContent =
                        '搜索结果 (' + total + '条)  用时 ' + elapsed + 's';

                    var enriched = items.map(function(item) {
                        return Object.assign({}, item, {
                            source: item.source || '-',
                            publish_time: item.publish_time || item.created_at || ''
                        });
                    });

                    Components.renderContentList('search-results', enriched);

                    Components.renderPagination('search-pagination', {
                        page: self.currentPage,
                        page_size: self.pageSize,
                        total: total,
                        total_pages: Math.ceil(total / self.pageSize)
                    }, function(page) {
                        self.currentPage = page;
                        self.doSearch();
                        window.scrollTo(0, 0);
                    });
                }).catch(function(err) {
                    document.getElementById('search-results').innerHTML = '<div class="empty-state"><p>搜索失败: ' + err.message + '</p></div>';
                });
            }
        };
    </script>
</body>
</html>
