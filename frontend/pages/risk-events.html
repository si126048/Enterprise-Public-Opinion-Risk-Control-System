<!-- Risk Events page -->
<div class="page-header">
  <div>
    <h1 class="page-title">风控事件</h1>
    <div class="page-subtitle">监控和管理风险事件</div>
  </div>
  <div class="page-actions">
    <button class="btn btn-primary btn-sm">+ 创建事件</button>
  </div>
</div>

<!-- Risk level distribution -->
<div class="grid grid-2" style="margin-bottom: 24px;">
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">事件等级分布</h3>
      <span class="card-subtitle">按严重性分级统计</span>
    </div>
    <div id="chart-risk-level" style="height: 300px;"></div>
  </div>
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">事件解决率</h3>
      <span class="card-subtitle">已解决事件占比 · 1 格 = 1%</span>
    </div>
    <div id="chart-risk-status" style="height: 300px;"></div>
  </div>
</div>

<!-- Events list -->
<div id="risk-events-list"></div>
