<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>风险主题 - 企业舆情风控·态势感知</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/mobile.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-brand">
            <span class="brand-icon">◆</span>
            <span class="brand-text">企业舆情风控</span>
        </div>
        <ul class="nav-links">
            <li><a href="../index.html">总览</a></li>
            <li><a href="content.html">舆情列表</a></li>
            <li><a href="search.html">语义搜索</a></li>
            <li><a href="topics.html" class="active">风险主题</a></li>
            <li><a href="review.html" class="nav-highlight">审核</a></li>
            <li><a href="risk_events.html">风控事件</a></li>
        </ul>
        <div class="nav-actions">
            <select id="company-selector" class="company-selector" title="选择公司"></select>
            <span class="data-badge">数据更新: 今日</span>
            <button class="theme-toggle" title="切换到夜间模式">☾</button>
            <button class="nav-toggle" aria-label="菜单">≡</button>
        </div>
    </nav>

    <div class="main-content">
        <div class="page-body">
            <!-- Header -->
            <div class="section" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.5rem">
                <div class="section-title" style="margin-bottom:0;border-bottom:none;padding-bottom:0">风险主题</div>
                <button id="btn-analyze" class="btn btn-primary">运行分析</button>
            </div>

            <!-- Stats -->
            <div id="topic-stats" class="grid grid-3 mb-2"></div>

            <!-- Loading -->
            <div id="loading-state" class="loading-state" style="display:none">
                <div class="loading-spinner"></div>
                <p>加载主题数据...</p>
            </div>

            <!-- Topic Cards -->
            <div id="topic-grid" class="grid grid-2"></div>

            <!-- Empty State -->
            <div id="empty-state" class="empty-state" style="display:none">
                <div class="empty-icon">◇</div>
                <p>暂无主题数据，请先运行种子脚本</p>
            </div>
        </div>
    </div>

    <!-- Topic Detail Modal -->
    <div id="topic-modal" class="modal-overlay">
        <div class="modal-box" style="max-width:640px">
            <div class="modal-header">
                <h3 id="topic-modal-title">主题详情</h3>
                <button class="modal-close">×</button>
            </div>
            <div id="topic-modal-body"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <span>企业舆情风控管理系统 v1.0.0</span>
        <span class="demo-tag">演示数据</span>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="../data/mock/mock_topics.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/charts.js"></script>
    <script src="../js/interactions.js"></script>
    <script src="../js/company_selector.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            CompanySelector.init();
            Interactions.init();
            TopicsPage.init();
        });

        var TopicsPage = {
            init: function() {
                this.loadTopics();

                document.getElementById('btn-analyze').addEventListener('click', function() {
                    var btn = this;
                    btn.disabled = true;
                    btn.textContent = '分析中...';
                    ApiService.analyzeContent().then(function(result) {
                        btn.textContent = '分析完成';
                        setTimeout(function() { btn.disabled = false; btn.textContent = '运行分析'; }, 2000);
                        TopicsPage.loadTopics();
                    }).catch(function(err) {
                        btn.disabled = false;
                        btn.textContent = '运行分析';
                        alert('分析失败: ' + err.message);
                    });
                });
            },

            loadTopics: function() {
                var self = this;
                document.getElementById('loading-state').style.display = 'block';
                document.getElementById('topic-grid').style.display = 'none';
                document.getElementById('empty-state').style.display = 'none';

                ApiService.getTopics().then(function(data) {
                    var topics = data.topics || data || [];
                    document.getElementById('loading-state').style.display = 'none';

                    if (topics.length === 0) {
                        document.getElementById('empty-state').style.display = 'block';
                        return;
                    }

                    document.getElementById('topic-grid').style.display = 'grid';
                    self.renderStats(topics);
                    self.renderTopicCards(topics);
                }).catch(function(err) {
                    document.getElementById('loading-state').style.display = 'none';
                    document.getElementById('empty-state').style.display = 'block';
                    console.error(err);
                });
            },

            renderStats: function(topics) {
                var totalContent = 0;
                topics.forEach(function(t) { totalContent += t.content_count || t.count || 0; });

                var cards = [
                    { label: '主题总数', value: topics.length },
                    { label: '关联内容', value: totalContent },
                    { label: '平均内容数', value: topics.length > 0 ? Math.round(totalContent / topics.length) : 0 }
                ];
                Components.renderStatCards('topic-stats', cards);
            },

            renderTopicCards: function(topics) {
                var grid = document.getElementById('topic-grid');
                grid.innerHTML = '';

                topics.forEach(function(topic, i) {
                    var count = topic.content_count || topic.count || 0;
                    var topicId = topic.topic_id || topic.id;
                    var name = topic.name || topicId;

                    var card = document.createElement('div');
                    card.className = 'card card-hover card-stagger';
                    card.style.animationDelay = (i * 0.06) + 's';
                    card.style.cursor = 'pointer';

                    var negRate = topic.negative_rate ? (topic.negative_rate * 100).toFixed(1) + '%' : '-';

                    card.innerHTML =
                        '<div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:0.75rem">' +
                            '<div>' +
                                '<div class="card-title">[' + escapeHtml(topicId) + '] ' + escapeHtml(name) + '</div>' +
                                '<div class="text-muted" style="font-size:0.8rem">' + count + ' 条内容</div>' +
                            '</div>' +
                            '<span class="badge badge-negative" style="font-size:0.75rem">负面率 ' + negRate + '</span>' +
                        '</div>' +
                        (topic.definition ? '<p style="font-size:0.85rem;color:var(--color-text-secondary);margin-bottom:0.75rem">' + escapeHtml(topic.definition) + '</p>' : '') +
                        '<div style="font-size:0.8rem;color:var(--color-text-muted)">点击查看主题详情 →</div>';

                    card.addEventListener('click', function() {
                        TopicsPage.showTopicDetail(topic);
                    });

                    grid.appendChild(card);
                });
            },

            showTopicDetail: function(topic) {
                var modal = document.getElementById('topic-modal');
                var title = document.getElementById('topic-modal-title');
                var body = document.getElementById('topic-modal-body');

                var topicId = topic.topic_id || topic.id;
                title.textContent = '[' + topicId + '] ' + (topic.name || topicId);

                var count = topic.content_count || topic.count || 0;
                var negRate = topic.negative_rate ? (topic.negative_rate * 100).toFixed(1) + '%' : '-';

                var html = '<div class="grid grid-3 mb-2">';
                html += '<div class="stat-card"><div class="stat-value">' + count + '</div><div class="stat-label">内容数</div></div>';
                html += '<div class="stat-card"><div class="stat-value">' + negRate + '</div><div class="stat-label">负面率</div></div>';

                var riskDist = topic.risk_distribution || {};
                var highPct = count > 0 ? Math.round((riskDist.high || 0) / count * 100) : 0;
                html += '<div class="stat-card"><div class="stat-value">' + highPct + '%</div><div class="stat-label">高风险占比</div></div>';
                html += '</div>';

                if (topic.anchors && topic.anchors.length > 0) {
                    html += '<div class="section-title" style="font-size:0.8rem">语义锚点</div>';
                    topic.anchors.forEach(function(a) {
                        html += '<div class="candidate-preview">' + escapeHtml(typeof a === 'string' ? a : a.text || a.content || '') + '</div>';
                    });
                }

                if (topic.sentiment_distribution) {
                    html += '<div class="section-title" style="font-size:0.8rem;margin-top:1rem">情感分布</div>';
                    html += '<div id="topic-sentiment-chart" style="height:160px"></div>';
                }

                body.innerHTML = html;
                modal.classList.add('active');

                if (topic.sentiment_distribution) {
                    setTimeout(function() {
                        var sd = topic.sentiment_distribution;
                        Charts.initSentimentDistribution('topic-sentiment-chart', [
                            { name: '正面', value: sd.positive || 0 },
                            { name: '中性', value: sd.neutral || 0 },
                            { name: '负面', value: sd.negative || 0 }
                        ]);
                    }, 100);
                }
            }
        };

        function escapeHtml(str) {
            if (!str) return '';
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }
    </script>
</body>
</html>
