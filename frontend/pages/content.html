<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诉求列表 - 五华民意·态势感知</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/mobile.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-brand">
            <span class="brand-icon">◆</span>
            <span class="brand-text">五华民意·态势感知</span>
        </div>
        <ul class="nav-links">
            <li><a href="../index.html">总览</a></li>
            <li><a href="content.html" class="active">诉求列表</a></li>
            <li><a href="search.html">语义搜索</a></li>
            <li><a href="topics.html">主题库</a></li>
            <li><a href="review.html" class="nav-highlight">审核</a></li>
            <li><a href="sources.html">来源</a></li>
            <li><a href="validation.html">验证</a></li>
        </ul>
        <div class="nav-actions">
            <span class="data-badge">数据更新: 今日</span>
            <button class="nav-toggle" aria-label="菜单">≡</button>
        </div>
    </nav>

    <div class="main-content">
        <div class="page-body">
            <!-- Filter Bar -->
            <div class="section">
                <div class="filter-bar">
                    <select id="filter-source" class="select" style="min-width:140px">
                        <option value="">全部来源</option>
                    </select>
                    <select id="filter-sentiment" class="select" style="min-width:120px">
                        <option value="">全部情感</option>
                        <option value="positive">正面</option>
                        <option value="neutral">中性</option>
                        <option value="negative">负面</option>
                    </select>
                    <select id="filter-risk" class="select" style="min-width:120px">
                        <option value="">全部风险</option>
                        <option value="high">高风险</option>
                        <option value="medium">中风险</option>
                        <option value="low">低风险</option>
                    </select>
                    <input type="text" id="filter-search" class="input" placeholder="搜索标题/内容..." style="flex:1;min-width:200px">
                    <button id="btn-import" class="btn btn-secondary btn-sm">导入 CSV</button>
                    <input type="file" id="file-input" accept=".csv,.json" style="display:none">
                </div>
            </div>

            <!-- Results Info -->
            <div id="results-info" class="text-muted mb-1" style="font-size:0.85rem"></div>

            <!-- Content List -->
            <div id="content-list"></div>

            <!-- Pagination -->
            <div id="pagination"></div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detail-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3>诉求详情</h3>
                <button class="modal-close">×</button>
            </div>
            <div id="detail-modal-body"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <span>昆明市五华区 | 课程演示项目</span>
        <span class="demo-tag">Demo Mode</span>
    </footer>

    <script src="../data/mock/mock_data.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/interactions.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            Interactions.init();
            ContentPage.init();
        });

        var ContentPage = {
            currentPage: 1,
            pageSize: 20,

            init: function() {
                this.bindEvents();
                this.loadSources();
                this.loadData();
            },

            bindEvents: function() {
                var self = this;

                document.getElementById('filter-source').addEventListener('change', function() { self.currentPage = 1; self.loadData(); });
                document.getElementById('filter-sentiment').addEventListener('change', function() { self.currentPage = 1; self.loadData(); });
                document.getElementById('filter-risk').addEventListener('change', function() { self.currentPage = 1; self.loadData(); });

                var searchInput = document.getElementById('filter-search');
                var debouncedSearch = debounce(function() { self.currentPage = 1; self.loadData(); }, 400);
                searchInput.addEventListener('input', debouncedSearch);

                document.getElementById('btn-import').addEventListener('click', function() {
                    document.getElementById('file-input').click();
                });

                document.getElementById('file-input').addEventListener('change', function(e) {
                    if (e.target.files.length > 0) {
                        var formData = new FormData();
                        formData.append('file', e.target.files[0]);
                        ApiService.importCSV(formData).then(function(result) {
                            alert('导入完成：' + (result.imported || 0) + ' 条新增，' + (result.skipped || 0) + ' 条跳过');
                            self.loadData();
                        }).catch(function(err) {
                            alert('导入失败: ' + err.message);
                        });
                    }
                });
            },

            loadSources: function() {
                ApiService.getSources().then(function(data) {
                    var select = document.getElementById('filter-source');
                    var items = data.items || [];
                    items.forEach(function(s) {
                        var opt = document.createElement('option');
                        opt.value = s.source_name;
                        opt.textContent = s.source_name;
                        select.appendChild(opt);
                    });
                }).catch(function() {});
            },

            loadData: function() {
                var self = this;
                var params = {
                    page: this.currentPage,
                    page_size: this.pageSize,
                    source: document.getElementById('filter-source').value || undefined,
                    sentiment: document.getElementById('filter-sentiment').value || undefined,
                    risk_level: document.getElementById('filter-risk').value || undefined,
                    search: document.getElementById('filter-search').value || undefined
                };

                ApiService.getContent(params).then(function(data) {
                    var items = data.items || [];
                    var pagination = data.pagination || {};

                    document.getElementById('results-info').textContent =
                        '共 ' + pagination.total + ' 条记录  展示 ' + ((pagination.page - 1) * pagination.page_size + 1) + '-' + Math.min(pagination.page * pagination.page_size, pagination.total);

                    Components.renderContentList('content-list', items);
                    Components.renderPagination('pagination', pagination, function(page) {
                        self.currentPage = page;
                        self.loadData();
                        window.scrollTo(0, 0);
                    });
                }).catch(function(err) {
                    document.getElementById('content-list').innerHTML = '<div class="empty-state"><p>加载失败: ' + err.message + '</p></div>';
                });
            }
        };

        function debounce(fn, ms) {
            var timer;
            return function() {
                clearTimeout(timer);
                timer = setTimeout(fn, ms);
            };
        }
    </script>
</body>
</html>
