<!-- Content / Opinion list page -->
<div class="page-header">
  <div>
    <h1 class="page-title">舆情列表</h1>
    <div class="page-subtitle">浏览所有舆情数据</div>
  </div>
  <div class="page-actions">
    <button class="btn btn-secondary btn-sm">📥 导出</button>
  </div>
</div>

<!-- Filters -->
<div class="filter-bar">
  <select class="select" id="filter-product">
    <option value="">全部产品</option>
    <option value="原神">原神</option>
    <option value="崩坏：星穹铁道">崩坏：星穹铁道</option>
    <option value="绝区零">绝区零</option>
  </select>
  <select class="select" id="filter-platform">
    <option value="">全部平台</option>
    <option value="B站">B站</option>
    <option value="微博">微博</option>
    <option value="TapTap">TapTap</option>
    <option value="小黑盒">小黑盒</option>
  </select>
  <select class="select" id="filter-credibility">
    <option value="">全部信度</option>
    <option value="high">高可信</option>
    <option value="medium">中可信</option>
    <option value="low">低可信</option>
    <option value="uncertain">不确定</option>
  </select>
  <input type="text" class="input" placeholder="搜索关键词..." style="flex:1; min-width: 200px;" />
</div>

<!-- Results info -->
<div id="results-info" style="font-size: 13px; color: var(--color-text-muted); margin-bottom: 12px;"></div>

<!-- Content list -->
<div id="content-list" class="grid" style="grid-template-columns: 1fr; gap: 12px;"></div>

<!-- Pagination -->
<div class="pagination" id="pagination"></div>
