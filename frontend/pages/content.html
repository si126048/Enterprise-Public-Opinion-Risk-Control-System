<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>舆情列表 - 企业舆情风控·态势感知</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/mobile.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-brand">
            <span class="brand-icon">◆</span>
            <span class="brand-text">企业舆情风控</span>
        </div>
        <ul class="nav-links">
            <li><a href="../index.html">总览</a></li>
            <li><a href="content.html" class="active">舆情列表</a></li>
            <li><a href="search.html">语义搜索</a></li>
            <li><a href="topics.html">风险主题</a></li>
            <li><a href="risk_events.html">风控事件</a></li>
        </ul>
        <div class="nav-actions">
            <select id="company-selector" class="company-selector" title="选择公司"></select>
            <span class="data-badge">数据更新: 今日</span>
            <button class="theme-toggle" title="切换到夜间模式">☾</button>
            <button class="nav-toggle" aria-label="菜单">≡</button>
        </div>
    </nav>

    <div class="main-content">
        <div class="page-body">
            <!-- Filter Bar -->
            <div class="section">
                <div class="filter-bar">
                    <select id="filter-product" class="select" style="min-width:120px">
                        <option value="">全部产品</option>
                        <option value="原神">原神</option>
                        <option value="崩坏：星穹铁道">崩坏：星穹铁道</option>
                        <option value="绝区零">绝区零</option>
                        <option value="未定事件簿">未定事件簿</option>
                        <option value="公司层面">公司层面</option>
                    </select>
                    <select id="filter-platform" class="select" style="min-width:120px">
                        <option value="">全部平台</option>
                        <option value="微博">微博</option>
                        <option value="小红书">小红书</option>
                        <option value="知乎">知乎</option>
                        <option value="B站">B站</option>
                        <option value="TapTap">TapTap</option>
                        <option value="小黑盒">小黑盒</option>
                        <option value="米游社">米游社</option>
                    </select>
                    <select id="filter-credibility" class="select" style="min-width:120px">
                        <option value="">全部信度</option>
                        <option value="high">高可信</option>
                        <option value="medium">中可信</option>
                        <option value="low">低可信</option>
                    </select>
                    <select id="filter-risk" class="select" style="min-width:120px">
                        <option value="">全部风险</option>
                        <option value="high">高风险</option>
                        <option value="medium">中风险</option>
                        <option value="low">低风险</option>
                    </select>
                    <input type="text" id="filter-search" class="input" placeholder="搜索标题/内容..." style="flex:1;min-width:200px">
                    <button id="btn-import" class="btn btn-secondary btn-sm">导入 CSV</button>
                    <input type="file" id="file-input" accept=".csv,.json" style="display:none">
                </div>
            </div>

            <!-- Results Info -->
            <div id="results-info" class="text-muted mb-1" style="font-size:0.85rem"></div>

            <!-- Content List -->
            <div id="content-list"></div>

            <!-- Pagination -->
            <div id="pagination"></div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detail-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3>舆情详情</h3>
                <button class="modal-close">×</button>
            </div>
            <div id="detail-modal-body"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <span>企业舆情风控管理系统 v1.0.0</span>
        <span class="demo-tag">演示数据</span>
    </footer>

    <script src="../data/mock/mock_data.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/interactions.js"></script>
    <script src="../js/company_selector.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            CompanySelector.init();
            Interactions.init();
            ContentPage.init();
        });

        var ContentPage = {
            currentPage: 1,
            pageSize: 20,

            init: function() {
                this.bindEvents();
                this.loadData();
            },

            bindEvents: function() {
                var self = this;

                document.getElementById('filter-product').addEventListener('change', function() { self.currentPage = 1; self.loadData(); });
                document.getElementById('filter-platform').addEventListener('change', function() { self.currentPage = 1; self.loadData(); });
                document.getElementById('filter-credibility').addEventListener('change', function() { self.currentPage = 1; self.loadData(); });
                document.getElementById('filter-risk').addEventListener('change', function() { self.currentPage = 1; self.loadData(); });

                var searchInput = document.getElementById('filter-search');
                var debouncedSearch = debounce(function() { self.currentPage = 1; self.loadData(); }, 400);
                searchInput.addEventListener('input', debouncedSearch);

                document.getElementById('btn-import').addEventListener('click', function() {
                    document.getElementById('file-input').click();
                });

                document.getElementById('file-input').addEventListener('change', function(e) {
                    if (e.target.files.length > 0) {
                        var formData = new FormData();
                        formData.append('file', e.target.files[0]);
                        ApiService.importCSV(formData).then(function(result) {
                            alert('导入完成：' + (result.imported || 0) + ' 条新增，' + (result.skipped || 0) + ' 条跳过');
                            self.loadData();
                        }).catch(function(err) {
                            alert('导入失败: ' + err.message);
                        });
                    }
                });
            },

            loadData: function() {
                var self = this;
                var params = {
                    page: this.currentPage,
                    page_size: this.pageSize,
                    product_name: document.getElementById('filter-product').value || undefined,
                    platform: document.getElementById('filter-platform').value || undefined,
                    credibility_level: document.getElementById('filter-credibility').value || undefined,
                    risk_level: document.getElementById('filter-risk').value || undefined,
                    search: document.getElementById('filter-search').value || undefined
                };

                ApiService.getContent(params).then(function(data) {
                    var items = data.items || [];
                    var pagination = data.pagination || {};

                    document.getElementById('results-info').textContent =
                        '共 ' + pagination.total + ' 条记录  展示 ' + ((pagination.page - 1) * pagination.page_size + 1) + '-' + Math.min(pagination.page * pagination.page_size, pagination.total);

                    Components.renderContentList('content-list', items);
                    Components.renderPagination('pagination', pagination, function(page) {
                        self.currentPage = page;
                        self.loadData();
                        window.scrollTo(0, 0);
                    });
                }).catch(function(err) {
                    document.getElementById('content-list').innerHTML = '<div class="empty-state"><p>加载失败: ' + err.message + '</p></div>';
                });
            }
        };

        function debounce(fn, ms) {
            var timer;
            return function() {
                clearTimeout(timer);
                timer = setTimeout(fn, ms);
            };
        }
    </script>
</body>
</html>
