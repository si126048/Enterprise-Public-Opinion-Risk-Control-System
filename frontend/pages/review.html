<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新主题审核 - 五华民意·态势感知</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/mobile.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-brand">
            <span class="brand-icon">◆</span>
            <span class="brand-text">五华民意·态势感知</span>
        </div>
        <ul class="nav-links">
            <li><a href="../index.html">总览</a></li>
            <li><a href="content.html">诉求列表</a></li>
            <li><a href="search.html">语义搜索</a></li>
            <li><a href="topics.html">主题库</a></li>
            <li><a href="review.html" class="active">审核</a></li>
            <li><a href="sources.html">来源</a></li>
            <li><a href="validation.html">验证</a></li>
        </ul>
        <div class="nav-actions">
            <span class="data-badge">数据更新: 今日</span>
            <button class="nav-toggle" aria-label="菜单">≡</button>
        </div>
    </nav>

    <div class="main-content">
        <div class="page-body">
            <!-- Header -->
            <div class="section" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.5rem">
                <div class="section-title" style="margin-bottom:0;border-bottom:none;padding-bottom:0">新主题审核</div>
                <div style="display:flex;align-items:center;gap:1rem;">
                    <span id="discovery-status" class="discovery-status"></span>
                    <button id="run-discovery-btn" class="btn btn-primary">运行发现</button>
                </div>
            </div>

            <!-- Stats -->
            <div id="stats-bar" class="grid grid-4 mb-2"></div>

            <!-- Filter -->
            <div class="filter-bar">
                <select class="select" id="filter-status" style="width:auto;min-width:160px;">
                    <option value="">全部状态</option>
                    <option value="pending">待审核</option>
                    <option value="approved">已批准</option>
                    <option value="merged">已合并</option>
                    <option value="ignored">已忽略</option>
                </select>
            </div>

            <!-- Loading -->
            <div id="loading-state" class="loading-state" style="display:none">
                <div class="loading-spinner"></div>
                <p>加载候选主题...</p>
            </div>

            <!-- Error -->
            <div id="error-state" class="empty-state" style="display:none">
                <p id="error-msg" style="color:var(--color-accent-orange);"></p>
            </div>

            <!-- Empty -->
            <div id="empty-state" class="empty-state" style="display:none">
                <div class="empty-icon">◇</div>
                <h3>暂无候选主题</h3>
                <p>请先运行发现，系统将自动聚类未知内容</p>
            </div>

            <!-- Candidates -->
            <div id="candidates-list" class="grid grid-2"></div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detail-modal" class="modal-overlay" style="display:none">
        <div class="modal-box modal-lg">
            <button class="modal-close" id="detail-modal-close">&times;</button>
            <div id="detail-modal-content"></div>
        </div>
    </div>

    <!-- Approve Modal -->
    <div id="approve-modal" class="modal-overlay" style="display:none">
        <div class="modal-box modal-lg">
            <button class="modal-close" id="approve-modal-close">&times;</button>
            <div id="approve-modal-content"></div>
        </div>
    </div>

    <!-- Merge Modal -->
    <div id="merge-modal" class="modal-overlay" style="display:none">
        <div class="modal-box">
            <button class="modal-close" id="merge-modal-close">&times;</button>
            <div id="merge-modal-content"></div>
        </div>
    </div>

    <!-- Ignore Modal -->
    <div id="ignore-modal" class="modal-overlay" style="display:none">
        <div class="modal-box">
            <button class="modal-close" id="ignore-modal-close">&times;</button>
            <div id="ignore-modal-content"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <span>五华区民意诉求语义分析系统 v0.7.0</span>
        <span class="demo-tag">演示数据</span>
    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/store.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/interactions.js"></script>
    <script>
    (function() {
        'use strict';

        var currentFilter = '';
        var actionCandidateId = null;

        function statusBadge(status) {
            var labels = { pending: '待审核', approved: '已批准', merged: '已合并', ignored: '已忽略' };
            var cls = { pending: 'badge-uncertain', approved: 'badge-positive', merged: 'badge-neutral', ignored: 'badge-negative' };
            return '<span class="badge ' + (cls[status] || 'badge-neutral') + '">' + (labels[status] || status) + '</span>';
        }

        function sentimentBadge(s) {
            var cls = { positive: 'badge-positive', negative: 'badge-negative', neutral: 'badge-neutral' };
            var labels = { positive: '正面', negative: '负面', neutral: '中性' };
            return '<span class="badge ' + (cls[s] || 'badge-neutral') + '">' + (labels[s] || s) + '</span>';
        }

        function riskBadge(r) {
            var cls = { low: 'badge-low', medium: 'badge-medium', high: 'badge-high' };
            var labels = { low: '低', medium: '中', high: '高' };
            return '<span class="badge ' + (cls[r] || 'badge-neutral') + '">' + (labels[r] || r) + '</span>';
        }

        function escapeHtml(t) {
            if (!t) return '';
            var d = document.createElement('div');
            d.textContent = t;
            return d.innerHTML;
        }

        function parseJson(str, fallback) {
            try { return JSON.parse(str || JSON.stringify(fallback)); } catch(e) { return fallback; }
        }

        function renderStats(stats) {
            var cards = [
                { label: '未知内容', value: stats.unknown_count || 0, icon: '◈', accent: 'var(--color-accent-orange)' },
                { label: '待审核', value: stats.pending || 0, icon: '◷', accent: 'var(--color-accent-yellow)' },
                { label: '已批准', value: stats.approved || 0, icon: '✓', accent: 'var(--color-accent-cyan)' },
                { label: '已忽略', value: stats.ignored || 0, icon: '—', accent: 'var(--color-text-muted)' }
            ];
            var html = '';
            for (var i = 0; i < cards.length; i++) {
                var c = cards[i];
                html += '<div class="stat-card" style="border-left:3px solid ' + c.accent + '">'
                    + '<div class="stat-icon" style="color:' + c.accent + '">' + c.icon + '</div>'
                    + '<div class="stat-value">' + c.value + '</div>'
                    + '<div class="stat-label">' + c.label + '</div>'
                    + '</div>';
            }
            document.getElementById('stats-bar').innerHTML = html;
        }

        function renderCandidates(candidates) {
            var list = document.getElementById('candidates-list');
            if (!candidates || candidates.length === 0) {
                list.innerHTML = '';
                document.getElementById('empty-state').style.display = 'block';
                return;
            }
            document.getElementById('empty-state').style.display = 'none';

            var html = '';
            for (var i = 0; i < candidates.length; i++) {
                var c = candidates[i];
                var anchors = parseJson(c.proposed_anchors_json, []);

                html += '<div class="candidate-card card-appear" style="animation-delay:' + (i * 0.08) + 's">'
                    + '<div class="candidate-header">'
                    + '<div class="candidate-title">' + escapeHtml(c.name || '未命名') + '</div>'
                    + statusBadge(c.status)
                    + '</div>'
                    + '<div class="candidate-desc">' + escapeHtml(c.description || '') + '</div>'
                    + '<div class="candidate-meta">'
                    + '<span>样本: ' + (c.sample_count || 0) + '</span>'
                    + '<span>方法: ' + escapeHtml(c.cluster_method || '-') + '</span>'
                    + '</div>';

                if (anchors.length > 0) {
                    html += '<div class="candidate-anchors">';
                    for (var j = 0; j < Math.min(anchors.length, 3); j++) {
                        html += '<div class="anchor-preview">' + escapeHtml(anchors[j]) + '</div>';
                    }
                    html += '</div>';
                }

                html += '<div class="candidate-actions">';
                if (c.status === 'pending') {
                    html += '<button class="btn btn-primary btn-sm" onclick="ReviewPage.showApprove(\'' + escapeHtml(c.id) + '\')">批准</button>'
                        + '<button class="btn btn-sm" onclick="ReviewPage.showMerge(\'' + escapeHtml(c.id) + '\')">合并</button>'
                        + '<button class="btn btn-danger btn-sm" onclick="ReviewPage.showIgnore(\'' + escapeHtml(c.id) + '\')">忽略</button>';
                }
                html += '<button class="btn btn-sm" onclick="ReviewPage.showDetail(\'' + escapeHtml(c.id) + '\')">详情</button>'
                    + '</div>'
                    + '</div>';
            }
            list.innerHTML = html;
        }

        function loadCandidates() {
            document.getElementById('loading-state').style.display = 'flex';
            document.getElementById('error-state').style.display = 'none';
            document.getElementById('empty-state').style.display = 'none';

            ApiService.getDiscoveryCandidates(currentFilter).then(function(data) {
                document.getElementById('loading-state').style.display = 'none';
                renderStats(data.stats || {});
                renderCandidates(data.candidates || []);
            }).catch(function(err) {
                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('error-state').style.display = 'block';
                document.getElementById('error-msg').textContent = '加载失败: ' + err.message;
            });
        }

        function runDiscovery() {
            var btn = document.getElementById('run-discovery-btn');
            var statusEl = document.getElementById('discovery-status');
            btn.disabled = true;
            btn.textContent = '发现中...';
            statusEl.textContent = '正在运行聚类分析...';
            statusEl.className = 'discovery-status';

            ApiService.runDiscovery().then(function(data) {
                btn.disabled = false;
                btn.textContent = '运行发现';
                var r = data.result || {};
                statusEl.textContent = r.message || '完成';
                statusEl.className = 'discovery-status ' + (r.status === 'insufficient_data' ? 'status-warn' : 'status-ok');
                loadCandidates();
            }).catch(function(err) {
                btn.disabled = false;
                btn.textContent = '运行发现';
                statusEl.textContent = '失败: ' + err.message;
                statusEl.className = 'discovery-status status-err';
            });
        }

        function showDetail(id) {
            ApiService.getDiscoveryCandidateById(id).then(function(data) {
                var c = data.candidate;
                var content = data.representative_content || [];
                var anchors = data.proposed_anchors || [];

                var html = '<h2 class="modal-title">' + escapeHtml(c.name) + '</h2>'
                    + '<div style="margin-bottom:0.75rem">' + statusBadge(c.status) + '</div>'
                    + '<p class="modal-desc">' + escapeHtml(c.description || '') + '</p>';

                if (anchors.length > 0) {
                    html += '<h3 class="modal-subtitle">提议锚点</h3>';
                    for (var i = 0; i < anchors.length; i++) {
                        html += '<div class="anchor-preview">' + escapeHtml(anchors[i]) + '</div>';
                    }
                }

                if (content.length > 0) {
                    html += '<h3 class="modal-subtitle" style="margin-top:1rem">代表性内容</h3>'
                        + '<table class="data-table"><thead><tr><th>标题</th><th>来源</th><th>情感</th><th>风险</th></tr></thead><tbody>';
                    for (var j = 0; j < content.length; j++) {
                        var r = content[j];
                        html += '<tr><td>' + escapeHtml(r.title || r.id) + '</td>'
                            + '<td>' + escapeHtml(r.source || '-') + '</td>'
                            + '<td>' + sentimentBadge(r.sentiment) + '</td>'
                            + '<td>' + riskBadge(r.risk_level) + '</td></tr>';
                    }
                    html += '</tbody></table>';
                }

                document.getElementById('detail-modal-content').innerHTML = html;
                document.getElementById('detail-modal').style.display = 'flex';
            }).catch(function(err) {
                alert('加载详情失败: ' + err.message);
            });
        }

        function showApprove(id) {
            actionCandidateId = id;
            ApiService.getDiscoveryCandidateById(id).then(function(data) {
                var c = data.candidate;
                var anchors = data.proposed_anchors || [];

                var html = '<h2 class="modal-title">批准确认</h2>'
                    + '<p style="margin-bottom:0.75rem">即将创建新主题：<strong>' + escapeHtml(c.name) + '</strong></p>'
                    + '<p class="modal-desc">' + escapeHtml(c.description || '') + '</p>';

                if (anchors.length > 0) {
                    html += '<h3 class="modal-subtitle">将创建以下锚点</h3>';
                    for (var i = 0; i < anchors.length; i++) {
                        html += '<div class="anchor-preview">' + escapeHtml(anchors[i]) + '</div>';
                    }
                }

                html += '<div class="modal-actions">'
                    + '<button class="btn btn-primary" id="confirm-approve-btn">确认批准</button>'
                    + '<button class="btn" id="cancel-approve-btn">取消</button>'
                    + '</div>';

                document.getElementById('approve-modal-content').innerHTML = html;
                document.getElementById('approve-modal').style.display = 'flex';

                document.getElementById('confirm-approve-btn').addEventListener('click', doApprove);
                document.getElementById('cancel-approve-btn').addEventListener('click', function() {
                    document.getElementById('approve-modal').style.display = 'none';
                });
            });
        }

        function doApprove() {
            if (!actionCandidateId) return;
            ApiService.approveCandidate(actionCandidateId).then(function() {
                document.getElementById('approve-modal').style.display = 'none';
                loadCandidates();
            }).catch(function(err) {
                alert('批准失败: ' + err.message);
            });
        }

        function showMerge(id) {
            actionCandidateId = id;
            ApiService.getDiscoveryCandidateById(id).then(function() {
                var html = '<h2 class="modal-title">合并到已有主题</h2>'
                    + '<p class="modal-desc">选择目标主题，候选锚点将添加到该主题中</p>'
                    + '<div id="merge-topics-list" style="margin-bottom:1rem"></div>'
                    + '<div class="modal-actions">'
                    + '<button class="btn btn-primary" id="confirm-merge-btn">确认合并</button>'
                    + '<button class="btn" id="cancel-merge-btn">取消</button>'
                    + '</div>';

                document.getElementById('merge-modal-content').innerHTML = html;
                document.getElementById('merge-modal').style.display = 'flex';

                ApiService.getTopics().then(function(data) {
                    var topics = data.topics || [];
                    var selectHtml = '<select class="select" id="merge-target-select">';
                    for (var i = 0; i < topics.length; i++) {
                        selectHtml += '<option value="' + escapeHtml(topics[i].id) + '">' + escapeHtml(topics[i].name) + '</option>';
                    }
                    selectHtml += '</select>';
                    document.getElementById('merge-topics-list').innerHTML = selectHtml;
                });

                document.getElementById('confirm-merge-btn').addEventListener('click', doMerge);
                document.getElementById('cancel-merge-btn').addEventListener('click', function() {
                    document.getElementById('merge-modal').style.display = 'none';
                });
            });
        }

        function doMerge() {
            if (!actionCandidateId) return;
            var targetId = document.getElementById('merge-target-select').value;
            ApiService.mergeCandidate(actionCandidateId, targetId).then(function() {
                document.getElementById('merge-modal').style.display = 'none';
                loadCandidates();
            }).catch(function(err) {
                alert('合并失败: ' + err.message);
            });
        }

        function showIgnore(id) {
            actionCandidateId = id;
            var html = '<h2 class="modal-title">忽略候选主题</h2>'
                + '<p class="modal-desc">可选填写忽略原因</p>'
                + '<textarea class="textarea" id="ignore-comment" placeholder="忽略原因（可选）" rows="3"></textarea>'
                + '<div class="modal-actions">'
                + '<button class="btn btn-danger" id="confirm-ignore-btn">确认忽略</button>'
                + '<button class="btn" id="cancel-ignore-btn">取消</button>'
                + '</div>';

            document.getElementById('ignore-modal-content').innerHTML = html;
            document.getElementById('ignore-modal').style.display = 'flex';

            document.getElementById('confirm-ignore-btn').addEventListener('click', doIgnore);
            document.getElementById('cancel-ignore-btn').addEventListener('click', function() {
                document.getElementById('ignore-modal').style.display = 'none';
            });
        }

        function doIgnore() {
            if (!actionCandidateId) return;
            var comment = document.getElementById('ignore-comment').value;
            ApiService.ignoreCandidate(actionCandidateId, comment).then(function() {
                document.getElementById('ignore-modal').style.display = 'none';
                loadCandidates();
            }).catch(function(err) {
                alert('忽略失败: ' + err.message);
            });
        }

        // Modal close handlers
        function setupModal(modalId, closeBtnId) {
            document.getElementById(closeBtnId).addEventListener('click', function() {
                document.getElementById(modalId).style.display = 'none';
            });
            document.getElementById(modalId).addEventListener('click', function(e) {
                if (e.target === this) this.style.display = 'none';
            });
        }

        setupModal('detail-modal', 'detail-modal-close');
        setupModal('approve-modal', 'approve-modal-close');
        setupModal('merge-modal', 'merge-modal-close');
        setupModal('ignore-modal', 'ignore-modal-close');

        // Events
        document.getElementById('run-discovery-btn').addEventListener('click', runDiscovery);
        document.getElementById('filter-status').addEventListener('change', function() {
            currentFilter = this.value;
            loadCandidates();
        });

        // Init
        Interactions.initNavbar();
        Interactions.initPageTransition();
        loadCandidates();

        // Expose for onclick handlers
        window.ReviewPage = {
            showDetail: showDetail,
            showApprove: showApprove,
            showMerge: showMerge,
            showIgnore: showIgnore
        };
    })();
    </script>
</body>
</html>
