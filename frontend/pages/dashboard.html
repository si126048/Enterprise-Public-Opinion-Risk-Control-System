<!-- Dashboard page - loaded dynamically into content area -->
<div class="page-header">
  <div>
    <h1 class="page-title">舆情总览</h1>
    <div class="page-subtitle">数据更新时间：<span id="update-time">--</span></div>
  </div>
  <div class="page-actions">
    <button class="btn btn-secondary btn-sm" onclick="location.reload()"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" style="width:14px;height:14px;vertical-align:-2px;margin-right:2px"><path d="M3 9a6 6 0 1 1 1.5 4M3 9V4m0 5H8"/></svg> 刷新</button>
  </div>
</div>

<!-- Stats cards -->
<div id="stats-cards" class="grid grid-4" style="margin-bottom: 24px;"></div>

<!-- Charts row 1: Trend + Topic Rank -->
<div class="grid grid-2" style="margin-bottom: 24px;">
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">近期趋势</h3>
      <span class="card-subtitle">14 天舆情总量与低信度走势</span>
    </div>
    <div id="chart-trend" style="height: 340px;"></div>
  </div>
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">风险主题排行</h3>
      <span class="card-subtitle">按关联舆情数量排序 · Top 8</span>
    </div>
    <div id="chart-topic-rank" style="height: 340px;"></div>
  </div>
</div>

<!-- Charts row 2: Platform + Product distribution -->
<div class="grid grid-2" style="margin-bottom: 24px;">
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">舆情发布时刻</h3>
      <span class="card-subtitle">1 扇 = 1 条舆情 · 角度 = 发布时刻 · 半径 = 互动量 · 红描边 = 低信度</span>
    </div>
    <div id="chart-platform" style="height: 340px;"></div>
  </div>
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">产品构成</h3>
      <span class="card-subtitle">每点 = 1% · 各产品线舆情占比</span>
    </div>
    <div id="chart-product" style="height: 340px;"></div>
  </div>
</div>

<!-- Charts row 3: Heat Calendar (full width) -->
<div class="card reveal-item" style="margin-bottom: 24px;">
  <div class="card-header">
    <h3 class="card-title">舆情发布时间热力图</h3>
    <span class="card-subtitle">近 3 个月 · 一格一天 · 点面积 = 当日舆情量 · 黄 = 峰值</span>
  </div>
  <div id="chart-heat-calendar" style="height: 460px;"></div>
</div>

<!-- Charts row 4: Funnel + Radar -->
<div class="grid grid-2" style="margin-bottom: 24px;">
  <div class="card reveal-item">
    <div class="card-header">
      <h3 class="card-title">信度分布</h3>
      <span class="card-subtitle">各信度等级舆情数量</span>
    </div>
    <div id="chart-credibility-funnel" style="height: 340px;"></div>
  </div>
  <div class="card reveal-item">
    <div class="card-header">
      <h3 class="card-title">多维风险画像</h3>
      <span class="card-subtitle">风险维度雷达</span>
    </div>
    <div id="chart-sentiment-radar" style="height: 340px;"></div>
  </div>
</div>

<!-- Recent events -->
<div class="card">
  <div class="card-header">
    <h3 class="card-title">最新风险动态</h3>
  </div>
  <div id="recent-events"></div>
</div>

<script>
  document.getElementById('update-time').textContent = new Date().toLocaleString('zh-CN');
</script>
