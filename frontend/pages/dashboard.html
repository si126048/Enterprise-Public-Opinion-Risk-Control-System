<!-- Dashboard page - loaded dynamically into content area -->
<div class="page-header">
  <div>
    <h1 class="page-title">舆情总览</h1>
    <div class="page-subtitle">数据更新时间：<span id="update-time">--</span></div>
  </div>
  <div class="page-actions">
    <button class="btn btn-secondary btn-sm" onclick="location.reload()">🔄 刷新</button>
  </div>
</div>

<!-- Stats cards -->
<div id="stats-cards" class="grid grid-4" style="margin-bottom: 24px;"></div>

<!-- Charts row 1: Trend + Topic Rank -->
<div class="grid grid-2" style="margin-bottom: 24px;">
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">近期趋势</h3>
      <span class="card-subtitle">14 天舆情总量与低信度走势</span>
    </div>
    <div id="chart-trend" style="height: 280px;"></div>
  </div>
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">风险主题排行</h3>
      <span class="card-subtitle">按关联舆情数量排序 · Top 8</span>
    </div>
    <div id="chart-topic-rank" style="height: 280px;"></div>
  </div>
</div>

<!-- Charts row 2: Platform + Product distribution -->
<div class="grid grid-2" style="margin-bottom: 24px;">
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">平台分布</h3>
      <span class="card-subtitle">各渠道舆情来源占比</span>
    </div>
    <div id="chart-platform" style="height: 260px;"></div>
  </div>
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">产品分布</h3>
      <span class="card-subtitle">各产品线舆情数量</span>
    </div>
    <div id="chart-product" style="height: 260px;"></div>
  </div>
</div>

<!-- Recent events -->
<div class="card">
  <div class="card-header">
    <h3 class="card-title">最新风险动态</h3>
  </div>
  <div id="recent-events"></div>
</div>

<script>
  document.getElementById('update-time').textContent = new Date().toLocaleString('zh-CN');
</script>
